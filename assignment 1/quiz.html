<!DOCTYPE html>
<html>

<head>
    <title>Quiz Form</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>

    <h2>Quiz Registration</h2>

    <form>
        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Roll Number:</label>
        <input type="text" name="roll" required/>
        <br><br>

        <label>Section:</label>
         <input type="radio"  name="section" value="a" required/>A
         <input type="radio"  name="section" value="b" required/>B
         <input type="radio"  name="section" value="c" required/>C
        <br><br>

        <button type="submit"><a href="question.html">Start Quiz</a></button>
    </form>

    

</body>
<script src="quiz.js"></script>
</html>
