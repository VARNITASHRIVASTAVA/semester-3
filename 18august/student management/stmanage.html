<html>
    <head>
        <title>Student Management</title>
        <link rel="stylesheet" href="stmanage.css">
    </head>
    <body>
        <h1>Student Management System</h1>
        <div class="container">
        <form id="form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br>
            <label for="roll">Roll Number:</label>
            <input type="text" id="roll" name="roll" required>
            <br>
            <label for="english">English Marks:</label>
            <input type="number" id="english" name="english" required min="0" max="100">
            <br>
             <label for="maths">Mathematics Marks:</label>
            <input type="number" id="maths" name="maths" required min="0" max="100">
            <br>
             <label for="science">Science Marks:</label>
            <input type="number" id="science" name="science" required min="0" max="100">
            <br>
             <label for="social">Social Marks:</label>
            <input type="number" id="social" name="social" required min="0" max="100">

            <br>
            <button onclick="calculateTotal()">Calculate</button>
            <button type="button" id="clear">Clear All</button>
            <h3 id="result"></h3>

        </form>
        <script src="stmanage.js"></script>
        </div>
    </body>
</html>
